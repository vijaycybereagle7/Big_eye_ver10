"""pytest.ini - Pytest configuration file."""

[tool:pytest]
# Test discovery
testpaths = testing/unit testing/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    load: Load tests
    slow: Slow running tests
    database: Tests requiring database
    redis: Tests requiring Redis
    external_api: Tests requiring external APIs
    ml_model: Tests requiring ML models
    performance: Performance tests
    security: Security tests

# Test output
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --disable-warnings
    --color=yes
    --durations=10
    --cov=api
    --cov=ai_ml
    --cov=threat_intelligence
    --cov-report=term-missing
    --cov-report=html:testing/coverage/reports/html
    --cov-report=xml:testing/coverage/reports/coverage.xml
    --cov-fail-under=70
    --junit-xml=testing/reports/junit.xml
    --html=testing/reports/report.html
    --self-contained-html

# Minimum version
minversion = 7.0

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:requests.*
    ignore::UserWarning:urllib3.*

# Test timeouts
timeout = 300
timeout_method = thread

# Parallel execution
# Uncomment to enable parallel testing
# addopts = -n auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
[coverage:run]
source = 
    api/
    ai_ml/
    threat_intelligence/
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    */node_modules/*
    */static/*
    */media/*
    setup.py
    manage.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

show_missing = true
precision = 2

[coverage:html]
directory = testing/coverage/reports/html

[coverage:xml]
output = testing/coverage/reports/coverage.xml
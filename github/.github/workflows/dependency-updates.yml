name: Dependency Updates

on:
  schedule:
    # Check for updates every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install pip-tools
      run: |
        pip install pip-tools

    - name: Update Python dependencies
      run: |
        # Update requirements files
        pip-compile --upgrade requirements.in
        pip-compile --upgrade api/requirements.in
        pip-compile --upgrade ai_ml/anomaly_detection/requirements.in
        pip-compile --upgrade ai_ml/nlp/requirements.in
        pip-compile --upgrade ai_ml/pattern_recognition/requirements.in
        pip-compile --upgrade threat_intelligence/collection/requirements.in
        pip-compile --upgrade testing/requirements.in

    - name: Check for security updates
      run: |
        pip install safety
        safety check --json --output security-update-report.json || true

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update dependencies"
        title: "🔄 Dependency Updates"
        body: |
          ## Dependency Updates
          
          This PR updates Python dependencies to their latest compatible versions.
          
          ### Security Updates
          Security vulnerabilities will be highlighted in the CI checks.
          
          ### Breaking Changes
          Please review the changelogs of updated packages for any breaking changes.
          
          ### Testing
          All tests must pass before merging.
          
          ---
          *This PR is automatically created by the dependency update workflow.*
        branch: update/dependencies
        delete-branch: true

  update-python-version:
    name: Check Python Version Updates
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Check Python 3.11 compatibility
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r api/requirements.txt
        pip install -r testing/requirements.txt
        python -m pytest testing/unit/ --disable-warnings

    - name: Test with Python 3.11
      run: |
        python --version
        python -c "import sys; print(sys.version)"

    - name: Create issue if Python update needed
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Consider updating to Python 3.11',
            body: 'The project has been tested with Python 3.11 and all tests pass. Consider updating the CI workflow to use Python 3.11 for better performance and newer features.',
            labels: ['enhancement', 'python']
          })

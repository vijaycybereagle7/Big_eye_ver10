# FOSSASYA configuration for advanced dependency management
version: 1
updates:
  # Enable FOSSASYA security analysis for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # FOSSASYA-specific configuration
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # Security updates only
    ignore:
      - dependency-name: "pytest"
        versions: ["<7.0.0"]  # Ignore old versions
    # Custom commit message for security updates
    commit-message:
      prefix: "security"
      prefix-development: "security-dev"
      include: "scope"
    # Labels for security-related PRs
    labels:
      - "security"
      - "dependencies"
      - "python"
    # Assign reviewers for security updates
    reviewers:
      - "security-team"
      - "maintainer-username"
    
    # Vulnerability alerts configuration
    vuln-enrichment:
      enabled: true
      enable-ecosystem-packages: true
    
    # License compliance checking
    license-allowlist:
      - "MIT"
      - "Apache-2.0"
      - "BSD-3-Clause"
      - "BSD-2-Clause"
      - "ISC"
      - "Unlicense"
    
    # Package version constraints
    versioning-strategy: increase

  # API dependencies with security focus
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "security"
      - "dependencies"
      - "api"
    # Critical API security updates
    ignore:
      - dependency-name: "fastapi"
        versions: ["<0.68.0"]  # Ensure critical security patches

  # Database dependencies with additional security checks
  - package-ecosystem: "pip"
    directory: "/database"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "security"
      - "dependencies"
      - "database"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "security"
      - "dependencies"
      - "docker"
    # Monitor base images for CVEs
    ignore:
      - dependency-name: "python"
        versions: ["<3.9.0"]  # Ensure supported Python versions

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "security"
      - "dependencies"
      - "github-actions"

# Global configuration for all ecosystems
registries:
  - type: python-index
    url: https://pypi.org/simple/

# Security scanning configuration
security:
  # Enable vulnerability scanning
  vulnerability-alerts: true
  
  # Severity thresholds
  severity-threshold: medium
  
  # Automated security fixes
  auto-fix:
    enabled: true
    min-severity: low
    
  # License scanning
  license-scanning:
    enabled: true
    
  # SBOM generation
  sbom:
    enabled: true
    formats: ["spdx", "cyclonedx"]

# Notification settings
notifications:
  # GitHub security alerts
  github-security-alerts:
    enabled: true
    
  # Slack notifications (configure webhook)
  slack:
    enabled: false
    webhook: null
    
  # Email notifications
  email:
    enabled: false
    recipients: ["security@yourorg.com"]

# Compliance settings
compliance:
  # Industry standards
  frameworks:
    - "PCI-DSS"
    - "SOC2"
    - "GDPR"
    
  # Security policies
  policies:
    - "no-unknown-vulnerabilities"
    - "no-critical-vulnerabilities"
    - "no-high-vulnerabilities"
    
  # Reporting
  reporting:
    enabled: true
    format: "json"
    output: "security-reports/"
    frequency: "weekly"

# Custom rules
custom-rules:
  # Block vulnerable packages
  blocklist:
    - "package-name"  # Add packages to block
    
  # Require specific versions
  version-constraints:
    - "django>=3.2,<5.0"
    - "cryptography>=3.4"
    
  # Security policies
  security-policies:
    - "require-https-for-python"
    - "no-insecure-transport"
    - "require-version-constraints"
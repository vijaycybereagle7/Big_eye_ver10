---
# Network Policy for Prometheus (restrictive)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-prometheus
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
  - Ingress
  ingress:
  # Allow from monitoring namespace only
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Allow from Grafana for service discovery
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Allow to scrape all pods in the application namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
    ports:
    - protocol: TCP
      port: 8001   # FastAPI metrics
    - protocol: TCP
      port: 9545   # Celery metrics
    - protocol: TCP
      port: 9187   # PostgreSQL exporter
    - protocol: TCP
      port: 9216   # MongoDB exporter
    - protocol: TCP
      port: 9121   # Redis exporter

---
# Default deny all namespace policy (if needed)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
{{- end }}
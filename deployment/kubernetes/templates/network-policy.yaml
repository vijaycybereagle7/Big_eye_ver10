{{- if .Values.networkPolicy.enabled }}
# Network Policy for FastAPI Application
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-fastapi
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: fastapi
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from Nginx/Ingress
  - from:
    - podSelector:
        matchLabels:
          component: nginx
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow metrics scraping from Prometheus
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8001
  # Allow from same namespace (health checks)
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow to databases
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mongodb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 27017  # MongoDB
    - protocol: TCP
      port: 6379  # Redis
  # Allow to external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443  # HTTPS
    - protocol: TCP
      port: 80   # HTTP

---
# Network Policy for Celery Workers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-celery-worker
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: celery-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow metrics scraping from Prometheus
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9545
  # Allow from same namespace (control plane communication)
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
    ports:
    - protocol: TCP
      port: 9545
  egress:
  # Allow to databases
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: mongodb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 27017
    - protocol: TCP
      port: 6379
  # Allow to FastAPI app (for task results)
  - to:
    - podSelector:
        matchLabels:
          component: fastapi
    ports:
    - protocol: TCP
      port: 8000

---
# Network Policy for Celery Beat
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-celery-beat
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: celery-beat
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from same namespace (web interface)
  - from:
    - namespaceSelector:
        matchLabels:
          name: {{ .Release.Namespace }}
    ports:
    - protocol: TCP
      port: 5555
  egress:
  # Allow to databases
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: redis
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379

---
# Network Policy for PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-postgresql
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
  - Ingress
  ingress:
  # Allow from FastAPI app
  - from:
    - podSelector:
        matchLabels:
          component: fastapi
    - podSelector:
        matchLabels:
          component: celery-worker
    - podSelector:
        matchLabels:
          component: celery-beat
    ports:
    - protocol: TCP
      port: 5432
  # Allow from backup jobs
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: backup
    ports:
    - protocol: TCP
      port: 5432


---
# Network Policy for Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-redis
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
  - Ingress
  ingress:
  # Allow from FastAPI app
  - from:
    - podSelector:
        matchLabels:
          component: fastapi
    - podSelector:
        matchLabels:
          component: celery-worker
    - podSelector:
        matchLabels:
          component: celery-beat
    ports:
    - protocol: TCP

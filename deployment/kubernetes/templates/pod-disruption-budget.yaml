{{- if .Values.podDisruptionBudget.enabled }}
# PodDisruptionBudget for FastAPI
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-fastapi
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: fastapi
spec:
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: fastapi

---
# PodDisruptionBudget for Celery Workers
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-celery-worker
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: celery-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: celery-worker

---
# PodDisruptionBudget for Celery Beat
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-celery-beat
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: celery-beat
spec:
  maxUnavailable: 0  # Ensure beat is always available
  selector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: celery-beat

---
# PodDisruptionBudget for Databases (read-only during maintenance)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-postgresql
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: postgresql
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-mongodb
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: mongodb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-redis
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: redis
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
{{- end }}

---
{{- if .Values.serviceMonitor.enabled }}
# ServiceMonitor for FastAPI
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-fastapi
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: fastapi
  {{- with .Values.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.serviceMonitor.namespace }}
  namespace: {{ .Values.serviceMonitor.namespace }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: fastapi
  endpoints:
  - port: metrics
    interval: {{ .Values.serviceMonitor.interval }}
    path: {{ .Values.serviceMonitor.path }}
    {{- with .Values.serviceMonitor.scrapeTimeout }}
    scrapeTimeout: {{ . }}
    {{- end }}

---
# ServiceMonitor for Celery Workers
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-celery-worker
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: celery-worker
spec:
  selector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: celery-worker
  endpoints:
  - port: metrics
    interval: {{ .Values.serviceMonitor.interval }}
    path: {{ .Values.serviceMonitor.path }}

---
# ServiceMonitor for Databases (PostgreSQL)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-postgresql
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: postgresql
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  endpoints:
  - port: http-metrics
    interval: {{ .Values.serviceMonitor.interval }}
    path: /metrics

---
# ServiceMonitor for MongoDB
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-mongodb
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: mongodb
spec:
  selector:
    matchLabels:

---
# PrometheusRule for Alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-alerts
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
  {{- with .Values.monitoring.prometheusRule.additionalLabels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.monitoring.prometheusRule.namespace }}
  namespace: {{ .Values.monitoring.prometheusRule.namespace }}
  {{- end }}
  groups:
  - name: threatintel.rules
    rules:
    {{- with .Values.monitoring.prometheusRule.rules.critical }}
    {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.monitoring.prometheusRule.rules.warning }}
    - alert: HighCPUUsage
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
    - alert: HighMemoryUsage
      expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
    - alert: FastAPIDown
      expr: up{job="fastapi-app"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "FastAPI application is down"
    - alert: CeleryWorkerDown
      expr: up{job="celery-worker"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Celery worker is down"
    {{- end }}
{{- end }}
# PostgreSQL Configuration for Threat Intelligence Platform
# Optimized for TimescaleDB and production workloads

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 512MB                    # 25% of total RAM
effective_cache_size = 1GB                # Estimate of OS cache size
maintenance_work_mem = 64MB
work_mem = 16MB
temp_buffers = 16MB

# WAL (Write-Ahead Logging) Settings
wal_level = replica
max_wal_senders = 10
wal_keep_segments = 64
checkpoint_completion_target = 0.7
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 512MB

# WAL Archiving for Point-in-Time Recovery
archive_mode = on
archive_command = 'cp %p /wal_archive/%f'
archive_timeout = 300                     # Archive every 5 minutes

# Logging Settings
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = off
log_rotation_age = 1d
log_rotation_size = 100MB

# Log details for monitoring
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 0

# Performance Settings
random_page_cost = 1.1                    # Good for SSD
effective_io_concurrency = 200
maintenance_work_mem = 64MB
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 8
max_parallel_maintenance_workers = 2

# TimescaleDB Settings
timescaledb.max_background_worker = 8
timescaledb.max_background_writer = 4
timescaledb.telemetry_level = off
timescaledb.enable_feature_flags = on

# Replication Settings
max_standby_streaming_delay = 30s
wal_receiver_status_interval = 10s
hot_standby_feedback = off

# Security Settings
ssl = off                                # Set to on in production with certificates
password_encryption = scram-sha-256
row_security = on

# Performance Monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
stats_temp_directory = 'pg_stat_tmp'

# Autovacuum Settings
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# Client Connection Defaults
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Additional settings for threat intelligence workload
shared_preload_libraries = 'timescale'
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64
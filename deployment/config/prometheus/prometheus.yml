# Prometheus Configuration for Threat Intelligence Platform
# Multi-instance monitoring with alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'threatintel'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'
rule_files:
  - "/etc/prometheus/rules/*.yml"

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # FastAPI Application
  - job_name: 'fastapi-app'
    static_configs:
      - targets: ['fastapi-app:8000']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    labels:
      service: 'api'
      component: 'application'

  # PostgreSQL + TimescaleDB
  - job_name: 'postgres-timescaledb'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'database'
      component: 'postgresql'

  # MongoDB
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'database'
      component: 'mongodb'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'cache'
      component: 'redis'

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'loadbalancer'
      component: 'nginx'

  # Celery Workers
  - job_name: 'celery-worker'
    static_configs:
      - targets: ['celery-exporter:9545']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'worker'
      component: 'celery'

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'system'

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'containers'

  # Alertmanager monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s
    metrics_path: /metrics
    labels:
      service: 'monitoring'
      component: 'alertmanager'

  # Application-specific jobs (if you have custom endpoints)
  - job_name: 'threatintel-api'
    static_configs:
      - targets: ['fastapi-app:8000']
    metrics_path: /api/v1/metrics
    scrape_interval: 60s
    scrape_timeout: 10s
    labels:
      service: 'api'
      component: 'threatintel'
    # Basic auth for API metrics (if implemented)
    basic_auth:
      username: 'prometheus'
      password: 'secure_password_here'
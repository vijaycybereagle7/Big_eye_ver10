# MongoDB Configuration for Threat Intelligence Platform
# Production-optimized settings

# Network settings
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000

# Security settings
security:
  authorization: enabled
  javascriptEnabled: false

# Storage settings
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.5
      journalCompressor: snappy
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Logging
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
  component:
    accessControl:
      verbosity: 0
    command:
      verbosity: 0
    control:
      verbosity: 0
    geo:
      verbosity: 0
    index:
      verbosity: 0
    network:
      verbosity: 0
      asio:
        verbosity: 0
    query:
      verbosity: 0
    replication:
      verbosity: 0
    sharding:
      verbosity: 0
    storage:
      verbosity: 0
      journal:
        verbosity: 0
    write:
      verbosity: 0

# Operation profiling
operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp

# Replication settings (for future use)
# replication:
#   replSetName: "threatintel-rs"

# Sharding settings (for future use)
# sharding:
#   clusterRole: configsvr
#   configDB: threatintel-config/primary-config:27019

# Default settings
setParameter:
  maxLogSizeKB: 10
  diagnosticDataCollectionEnabled: true
  diagnosticDataCollectionFilesSizeKB: 1000
  diagnosticDataCollectionPeriodMillis: 1000
  enableLocalHostAuthBypass: false
  profileUsageSampleRate: 1.0
  activeMonitoring: true
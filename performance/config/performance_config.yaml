# =============================================
# MIGRATION AND DEPLOYMENT
# =============================================

# Migration Settings
migration_batch_size = 1000
migration_max_concurrent = 4
migration_rollback_enabled = true

# Deployment Settings
blue_green_deployment = true
canary_deployment = true
canary_traffic_percentage = 10

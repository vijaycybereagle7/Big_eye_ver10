global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cybersecurity-api'
    environment: 'production'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Database Monitoring - PostgreSQL
  - job_name: 'postgresql-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Database Monitoring - MongoDB
  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    scrape_interval: 15s

  # Redis Monitoring
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # Application Metrics - API Gateway
  - job_name: 'api-gateway-metrics'
    static_configs:
      - targets: ['api-gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Application Metrics - Individual Services
  - job_name: 'threat-intelligence-service'
    static_configs:
      - targets: ['threat-intel-service:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'database-service'
    static_configs:
      - targets: ['database-service:8002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'ai-ml-service'
    static_configs:
      - targets: ['ai-ml-service:8003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Custom Application Monitoring
  - job_name: 'cybersecurity-api-metrics'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/health/metrics'
    scrape_interval: 5s

  # Threat Intelligence Feed Monitoring
  - job_name: 'threat-feed-monitoring'
    static_configs:
      - targets: ['threat-feed-monitor:9090']
    scrape_interval: 30s

  # Security Monitoring
  - job_name: 'security-monitor'
    static_configs:
      - targets: ['security-monitor:9090']
    scrape_interval: 15s

# Remote storage configuration (for long-term storage)
remote_write:
  - url: "http://victoriametrics:8428/api/v1/write"
    queue_config:
      max_samples_per_send: 10000
      max_shards: 200
      capacity: 2500

# Storage configuration
storage:
  tsdb:
    path: /prometheus
    retention.time: 30d
    retention.size: 10GB
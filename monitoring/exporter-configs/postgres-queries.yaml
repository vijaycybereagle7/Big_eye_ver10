# PostgreSQL Custom Queries for Enhanced Monitoring

# Connection pool metrics
pg_replica_lag:
  query: |
    SELECT
      EXTRACT(EPOCH FROM COALESCE(pg_last_xact_replay_timestamp(), NOW()) - NOW()) as lag
  master: true
  metrics:
    - lag:
        usage: "GAUGE"
        description: "Replica lag in seconds"

# Database size metrics
pg_database_size:
  query: |
    SELECT
      pg_size_pretty(pg_database_size(current_database())) as database_size,
      pg_database_size(current_database()) as database_size_bytes
  metrics:
    - database_size:
        usage: "GAUGE"
        description: "Database size in bytes"
    - database_size_pretty:
        usage: "GAUGE"
        description: "Database size in human readable format"

# Table size metrics
pg_table_sizes:
  query: |
    SELECT
      schemaname,
      tablename,
      pg_size_pretty(pg_total_relation_size(schemaname||'.'||tablename)) as size_pretty,
      pg_total_relation_size(schemaname||'.'||tablename) as size_bytes
    FROM pg_tables
    WHERE schemaname NOT IN ('information_schema', 'pg_catalog')
    ORDER BY pg_total_relation_size(schemaname||'.'||tablename) DESC
    LIMIT 20
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "Schema name"
    - tablename:
        usage: "LABEL"
        description: "Table name"
    - size_bytes:
        usage: "GAUGE"
        description: "Table size in bytes"

# Index usage metrics
pg_index_usage:
  query: |
    SELECT
      schemaname,
      tablename,
      indexname,
      idx_tup_read,
      idx_tup_fetch
    FROM pg_stat_user_indexes
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "Schema name"
    - tablename:
        usage: "LABEL"
        description: "Table name"
    - indexname:
        usage: "LABEL"
        description: "Index name"
    - idx_tup_read:
        usage: "COUNTER"
        description: "Number of index entries read"
    - idx_tup_fetch:
        usage: "COUNTER"
        description: "Number of index entries fetched by simple index scans"

# Cache hit ratio
pg_cache_hit_ratio:
  query: |
    SELECT
      sum(heap_blks_hit) / (sum(heap_blks_hit) + sum(heap_blks_read)) AS cache_hit_ratio
    FROM pg_statio_user_tables
  metrics:
    - cache_hit_ratio:
        usage: "GAUGE"
        description: "Cache hit ratio (0-1)"

# Long running queries
pg_long_running_queries:
  query: |
    SELECT
      pid,
      usename,
      application_name,
      client_addr,
      state,
      EXTRACT(EPOCH FROM (now() - query_start)) as duration
    FROM pg_stat_activity
    WHERE state != 'idle'
      AND query_start < now() - interval '1 minute'
    ORDER BY duration DESC
  metrics:
    - pid:
        usage: "GAUGE"
        description: "Process ID"
    - usename:
        usage: "LABEL"
        description: "Username"
    - application_name:
        usage: "LABEL"
        description: "Application name"
    - client_addr:
        usage: "LABEL"
        description: "Client address"
    - state:
        usage: "LABEL"
        description: "Query state"
    - duration:
        usage: "GAUGE"
        description: "Query duration in seconds"

# Lock information
pg_locks_info:
  query: |
    SELECT
      mode,
      locktype,
      granted,
      count(*) as lock_count
    FROM pg_locks
    GROUP BY mode, locktype, granted
  metrics:
    - mode:
        usage: "LABEL"
        description: "Lock mode"
    - locktype:
        usage: "LABEL"
        description: "Lock type"
    - granted:
        usage: "LABEL"
        description: "Lock granted status"
    - lock_count:
        usage: "GAUGE"
        description: "Number of locks"

# Replication lag
pg_replication_status:
  query: |
    SELECT
      application_name,
      client_addr,
      state,
      sync_state,
      EXTRACT(EPOCH FROM COALESCE(pg_last_xact_replay_timestamp(), NOW()) - NOW()) as lag
    FROM pg_stat_replication
  metrics:
    - application_name:
        usage: "LABEL"
        description: "Replication application name"
    - client_addr:
        usage: "LABEL"
        description: "Replica address"
    - state:
        usage: "LABEL"
        description: "Replica state"
    - sync_state:
        usage: "LABEL"
        description: "Synchronization state"
    - lag:
        usage: "GAUGE"
        description: "Replica lag in seconds"

# Database connections by application
pg_connections_by_app:
  query: |
    SELECT
      application_name,
      state,
      count(*) as connection_count
    FROM pg_stat_activity
    GROUP BY application_name, state
  metrics:
    - application_name:
        usage: "LABEL"
        description: "Application name"
    - state:
        usage: "LABEL"
        description: "Connection state"
    - connection_count:
        usage: "GAUGE"
        description: "Number of connections"
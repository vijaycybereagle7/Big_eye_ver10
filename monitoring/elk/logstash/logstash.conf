# Logstash Configuration for Cybersecurity API

input {
  # HTTP Input for application logs
  http {
    port => 8080
    codec => json
  }

  # Beats input for system logs
  beats {
    port => 5044
  }

  # TCP input for application logs
  tcp {
    port => 5000
    codec => json
  }

  # Kafka input for high-throughput log ingestion
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["cybersecurity-logs", "threat-intel-logs", "security-logs"]
    group_id => "logstash"
    codec => json
  }

  # Syslog input
  syslog {
    port => 514
  }
}

filter {
  # Parse application logs
  if [fields][log_type] == "application" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{DATA:logger} - %{GREEDYDATA:log_message}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }

  # Parse API request logs
  if [fields][log_type] == "api" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:method} %{URIPATH:path} %{NUMBER:response_code} %{NUMBER:response_time:float}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }

  # Parse threat intelligence logs
  if [fields][log_type] == "threat_intel" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{WORD:level}\] %{DATA:feed_name} - %{GREEDYDATA:threat_details}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }

  # Parse security logs
  if [fields][log_type] == "security" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{WORD:level}\] %{DATA:component} - %{GREEDYDATA:security_event}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }

  # Database query logs
  if [fields][log_type] == "database" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{WORD:level}\] %{DATA:query_type} %{GREEDYDATA:query_details}"
      }
    }
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss.SSS" ]
    }
  }

  # Add geo-location for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Add severity field based on level
  if [level] {
    mutate {
      add_field => { "severity" => "%{level}" }
    }
  }

  # Add timestamp if missing
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs" ]
  }

  # Add custom fields for cybersecurity context
  mutate {
    add_field => {
      "environment" => "production"
      "application" => "cybersecurity-api"
    }
  }

  # Threat intelligence specific processing
  if [feed_name] {
    # Extract threat indicators
    grok {
      match => { 
        "threat_details" => "IP: %{IP:threat_ip}|Domain: %{DOMAIN:threat_domain}|Hash: %{WORD:threat_hash}"
      }
    }
  }

  # Security event categorization
  if [security_event] {
    if [security_event] =~ /failed.*login/i {
      mutate { add_tag => [ "auth_failure" ] }
    }
    if [security_event] =~ /malicious/i {
      mutate { add_tag => [ "malicious_activity" ] }
    }
    if [security_event] =~ /suspicious/i {
      mutate { add_tag => [ "suspicious_activity" ] }
    }
  }
}

output {
  # Primary Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "cybersecurity-logs-%{+YYYY.MM.dd}"
    template_name => "cybersecurity_logs"
    template_pattern => "cybersecurity-logs-*"
    template => "/usr/share/logstash/templates/cybersecurity-template.json"
  }

  # Debug output (optional)
  if [level] == "DEBUG" {
    stdout { 
      codec => rubydebug 
    }
  }

  # Alert output for critical security events
  if "malicious_activity" in [tags] or "auth_failure" in [tags] {
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      format => "json"
      mapping => {
        "alerts" => [{
          "labels" => {
            "alertname" => "SecurityLogAlert"
            "severity" => "critical"
            "log_type" => "%{fields][log_type}"
            "component" => "%{[component]}"
          }
          "annotations" => {
            "summary" => "Security event detected"
            "description" => "%{security_event}"
          }
        }]
      }
    }
  }

  # Archive old logs
  if [@timestamp] < now-30d {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "cybersecurity-archive-%{+YYYY.MM}"
    }
  }
}
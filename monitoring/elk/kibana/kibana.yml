# Kibana Configuration for Cybersecurity API Monitoring

# Server Configuration
server.name: "kibana"
server.host: "0.0.0.0"
server.port: 5601
server.basePath: ""

# Elasticsearch Configuration
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.username: "elastic"
elasticsearch.password: "${ELASTIC_PASSWORD}"

# Monitoring Configuration
monitoring.ui.container.elasticsearch.enabled: true
monitoring.ui.container.logstash.enabled: true

# Data Configuration
data.search.aggs.shardDelay.enabled: true

# Security Configuration
xpack.security.enabled: true
xpack.security.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"

# Reporting Configuration
xpack.reporting.enabled: true
xpack.reporting.encryptionKey: "${KIBANA_REPORTING_KEY}"

# Maps Configuration
xpack.maps.enabled: true

# ML Configuration
xpack.ml.enabled: true

# Graph Configuration
xpack.graph.enabled: true

# Canvas Configuration
xpack.canvas.enabled: true

# Logs Configuration
xpack.infra.enabled: true

# Alerting Configuration
xpack.alerting.enabled: true

# Index Pattern Configuration
kibana.defaultAppId: "discover"

# Saved Objects Configuration
kibana.index: ".kibana-cybersecurity"

# Telemetry Configuration
telemetry.enabled: false
telemetry.optIn: false

# Security Configuration
xpack.security.secureCookies: true

# CORS Configuration
server.cors: true
server.cors.origin: ".*"

# Logging Configuration
logging.appenders:
  file:
    type: file
    fileName: /usr/share/kibana/logs/kibana.log
    layout:
      type: json

logging.root:
  level: info
  appenders:
    - default
    - file

logging.loggers:
  - name: http.server.response
    level: debug

# Performance Configuration
ops.interval: 10000

# Feature Flags
xpack.grokdebugger.enabled: true
xpack.searchprofiler.enabled: true
xpack.indexManagement.enabled: true

# Index Lifecycle Management
xpack.rollup.enabled: true
# Logstash Configuration for Threat Intelligence Platform
# Multi-input, multi-output log processing pipeline

# Input configuration
input {
  # Beats input for Filebeat and Metricbeat
  beats {
    port => 5044
  }
  
  # TCP input for direct log forwarding
  tcp {
    port => 5000
    codec => json_lines
    type => "application_logs"
  }
  
  # UDP input for high-volume log streaming
  udp {
    port => 5000
    codec => json_lines
    type => "application_logs"
  }
  
  # HTTP input for API logs
  http {
    port => 8080
    codec => json
    type => "api_logs"
  }
}

# Filter configuration
filter {
  # Parse application logs
  if [type] == "application_logs" {
    # Parse JSON logs
    json {
      source => "message"
    }
    
    # Parse timestamp
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
      target => "@timestamp"
    }
    
    # Add service information
    mutate {
      add_field => {
        "service" => "threatintel"
        "environment" => "production"
      }
    }
  }
  
  # Nginx access logs
  if [fields][logtype] == "nginx-access" {
    grok {
      match => { 
        "message" => "%{COMBINEDAPACHELOG}" 
      }
    }
    
    # Parse response time
    if [response] {
      mutate {
        convert => { "response" => "float" }
      }
    }
    
    # Parse bytes
    if [bytes] {
      mutate {
        convert => { "bytes" => "integer" }
      }
    }
    
    # Add response time field
    mutate {
      add_field => { "response_time_ms" => "%{response}" }
    }
  }
  
  # Nginx error logs
  if [fields][logtype] == "nginx-error" {
    grok {
      match => {
        "message" => "%{NGINXERROR}"
      }
    }
  }
  
  # PostgreSQL logs
  if [fields][service] == "postgres" {
    grok {
      match => {
        "message" => "%{POSTGRESLOG}"
      }
    }
    
    # Parse log levels
    if [log_level] {
      mutate {
        uppercase => [ "log_level" ]
      }
    }
  }
  
  # MongoDB logs
  if [fields][service] == "mongodb" {
    grok {
      match => {
        "message" => "%{MONGODBLOG}"
      }
    }
  }
  
  # Redis logs
  if [fields][service] == "redis" {
    grok {
      match => {
        "message" => "%{REDISLOG}"
      }
    }
  }
  
  # Application specific patterns
  if [fields][application] == "fastapi" {
    # Parse FastAPI logs
    grok {
      match => {
        "message" => "\[(?:%{TIMESTAMP_ISO8601:timestamp})\] %{LOGLEVEL:level} %{GREEDYDATA:log_message}"
      }
    }
    
    # Extract HTTP method and route for API logs
    if [log_message] =~ /HTTP/ {
      grok {
        match => {
          "log_message" => "%{WORD:method} %{URIPATH:path} HTTP/%{NUMBER:http_version}"
        }
      }
    }
  }
  
  # Parse request ID for tracing
  if [request_id] {
    mutate {
      add_field => { "trace_id" => "%{request_id}" }
    }
  }
  
  # User agent parsing
  if [agent] {
    useragent {
      source => "agent"
      target => "user_agent"
    }
  }
  
  # Geographic location (if enabled)
  if [clientip] {
    geoip {
      source => "clientip"
      target => "geoip"
    }
  }
  
  # Sanitize sensitive data
  if [message] {
    mutate {
      gsub => [
        "message", "password=[^&\s]+", "password=***",
        "message", "token=[^&\s]+", "token=***",
        "message", "authorization=[^&\s]+", "authorization=***"
      ]
    }
  }
  
  # Add computed fields
  if [response] and [response] >= 400 {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  if [response] and [response] >= 500 {
    mutate {
      add_tag => [ "critical_error" ]
    }
  }
  
  # Response time analysis
  if [response_time] and [response_time] > 2000 {
    mutate {
      add_tag => [ "slow_response" ]
    }
  }
  
  # Remove empty fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }
}

# Output configuration
output {
  # Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "threatintel-logs-%{+YYYY.MM.dd}"
    template_name => "threatintel-logs"
    
    # Template configuration
    template_pattern => "threatintel-logs-*"
    template => "/usr/share/logstash/templates/threatintel-logs.json"
    
    # Pipeline configuration
    manage_template => true
    template_overwrite => true
    
    # Performance settings
    flush_size => 1000
    idle_flush_time => 1
  }
  
  # Debug output (remove in production)
  # stdout { codec => rubydebug }
  
  # Separate error logs
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "threatintel-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # Slow response logs
  if "slow_response" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "threatintel-slow-responses-%{+YYYY.MM.dd}"
    }
  }
  
  # Critical errors to separate index
  if "critical_error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "threatintel-critical-%{+YYYY.MM.dd}"
    }
    
    # Send critical alerts
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      format => "json"
      mapping => {
        "alerts" => [{
          "labels" => {
            "alertname" => "HighErrorRate"
            "service" => "%{service}"
            "severity" => "critical"
          }
          "annotations" => {
            "summary" => "Critical error detected in %{service}"
            "description" => "%{log_message}"
          }
        }]
      }
    }
  }
}
# Logstash main configuration file
# Settings for the Logstash pipeline

# Node configuration
node.name: "threatintel-logstash"

# Pipeline configuration
pipeline.workers: 2
pipeline.batch.size: 125
pipeline.batch.delay: 50

# Pipeline dead letter queue
dead_letter_queue.enable: true
path.dead_letter_queue: /usr/share/logstash/data/dead_letter_queue

# HTTP API settings
http.host: "0.0.0.0"
http.port: 9600

# JVM configuration
jvm.options:
  heap_size: 1g

# Path settings
path.data: /usr/share/logstash/data
path.config: /usr/share/logstash/pipeline
path.logs: /usr/share/logstash/logs

# Monitoring
xpack.monitoring.enabled: false
xpack.monitoring.elasticsearch.hosts: ["elasticsearch:9200"]

# Security
xpack.security.enabled: false

# Additional pipeline settings
queue.type: memory
queue.page_capacity: 64mb
queue.max_events: 0
queue.max_events_read_block: 0
queue.checkpoint.acks: 1024
queue.checkpoint.writes: 1024
queue.checkpoint.interval: 1000
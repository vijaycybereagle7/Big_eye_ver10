{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "threatintel-platform.fullname" . }}
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "threatintel-platform.fullname" $ }}-fastapi
                port:
                  number: {{ $.Values.fastapi.service.port }}
          {{- end }}
    {{- end }}
---
# Monitoring Ingress
{{- if .Values.grafana.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-grafana
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: grafana
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: grafana-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - grafana.{{ . | replace "threatintel" "threatintel" }}
        {{- end }}
      secretName: {{ .secretName }}-grafana
    {{- end }}
  {{- end }}
  rules:
  - host: grafana.{{ (first .Values.ingress.hosts).host | replace "threatintel" "threatintel" | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "threatintel-platform.fullname" . }}-grafana
            port:
              number: 80
{{- end }}
---
# Kibana Ingress
{{- if .Values.kibana.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-kibana
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: kibana
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: kibana-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - kibana.{{ . | replace "threatintel" "threatintel" }}
        {{- end }}
      secretName: {{ .secretName }}-kibana
    {{- end }}
  {{- end }}
  rules:
  - host: kibana.{{ (first .Values.ingress.hosts).host | replace "threatintel" "threatintel" | quote }}
    http:
      paths:

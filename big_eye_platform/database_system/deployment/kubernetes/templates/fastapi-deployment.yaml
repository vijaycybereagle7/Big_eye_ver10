{{- if .Values.fastapi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-fastapi
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: fastapi
spec:
  {{- if not .Values.fastapi.autoscaling.enabled }}
  replicas: {{ .Values.fastapi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "threatintel-platform.selectorLabels" . | nindent 6 }}
      component: fastapi
  template:
    metadata:
      {{- with .Values.fastapi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "threatintel-platform.selectorLabels" . | nindent 8 }}
        component: fastapi
    spec:
      {{- with .Values.fastapi.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "threatintel-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.fastapi.podSecurityContext | nindent 8 }}
      containers:
      - name: fastapi
        securityContext:
          {{- toYaml .Values.fastapi.securityContext | nindent 12 }}
        image: "{{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.fastapi.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.fastapi.service.port }}
          protocol: TCP
        - name: metrics
          containerPort: 8001
          protocol: TCP
        env:
        {{- range $key, $value := .Values.fastapi.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: DATABASE_URL
          value: {{ .Values.fastapi.env.DATABASE_URL }}
        - name: REDIS_URL
          value: {{ .Values.fastapi.env.REDIS_URL }}
        - name: MONGO_URI
          value: {{ .Values.fastapi.env.MONGO_URI }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.fastapi.resources | nindent 12 }}
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      {{- with .Values.fastapi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fastapi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fastapi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-fastapi
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: fastapi
  {{- with .Values.fastapi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.fastapi.service.type }}
  ports:
    - port: {{ .Values.fastapi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 8001
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "threatintel-platform.selectorLabels" . | nindent 4 }}
    component: fastapi
{{- if .Values.fastapi.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "threatintel-platform.fullname" . }}-fastapi
  labels:
    {{- include "threatintel-platform.labels" . | nindent 4 }}
    component: fastapi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "threatintel-platform.fullname" . }}-fastapi
  minReplicas: {{ .Values.fastapi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.fastapi.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.fastapi.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.fastapi.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.fastapi.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.fastapi.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}